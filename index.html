            whatsapp: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.894 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654z M12 5.583c.365 0 .703.111 1.002.316l.11.063c.27.185.27.516.035.797l-2.455 4.095c-.236.394-.099.811.306 1.018l.112.054c.48.243.987.362 1.553.362.593 0 1.192-.128 1.776-.39l.114-.05c.345-.165.732.14.595.53l-1.264 3.447c-.137.39-.56.632-.99.533l-.116-.023c-1.003-.19-1.958-.613-2.813-1.258l-.092-.063c-.855-.645-1.523-1.476-1.95-2.435l-.048-.113c-.237-.563.264-1.08.872-1.042l.115.006c.48.023.935.165 1.348.42l.09.048c.305.165.65.048.797-.264l1.18-2.455c.148-.318.048-.714-.249-.888l-.092-.048c-.287-.156-.593-.243-.913-.243-.332 0-.655.086-.948.243l-.09.056c-.33.208-.768.035-.872-.345l-.27-1.13c-.104-.428.165-.833.595-.913l.116-.023c.332-.063.67-.094 1.018-.094z"/></svg>`,

        const appContent = document.getElementById('app-content');
        const tabs = document.querySelectorAll('.nav-button');

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        const getGoogleDriveImageUrl = (sharingUrl) => {
            if (!sharingUrl || !sharingUrl.includes('drive.google.com')) {
                return sharingUrl || 'https://via.placeholder.com/150x100.png?text=No+Image';
            }
            const fileIdMatch = sharingUrl.match(/file\/d\/([a-zA-Z0-9_-]+)/);
            if (fileIdMatch && fileIdMatch[1]) {
                const fileId = fileIdMatch[1];
                return `https://drive.google.com/uc?export=view&id=${fileId}`;
            }
            return 'https://via.placeholder.com/150x100.png?text=Invalid+Link';
        };

        const debounce = (func, delay) => {
            let timeout;
            return function(...args) {
                const context = this;
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(context, args), delay);
            };
        };

        const highlightText = (text, query) => {
            if (!query || !text) return String(text);
            const escapedQuery = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
            const re = new RegExp(`(${escapedQuery})`, 'gi');
            return String(text).replace(re, '<span class="bg-yellow-200 font-bold rounded-sm">$1</span>');
        };
        
        const renderFunctions = {
            dashboard: renderDashboard,
            listings: renderListings,
            orders: renderOrders,
            payments: renderPayments,
            support: renderSupport,
            settings: renderSettings
        };

        function switchView(viewName) {
            tabs.forEach(tab => {
                tab.classList.toggle('active', tab.id === `tab-${viewName}`);
            });
            renderFunctions[viewName]();
        }

        // --- GLOBAL SEARCH FUNCTIONS ---
        function globalAdminSearch(query) {
            const lowerQuery = query.toLowerCase();
            const results = {
                products: [],
                customers: [],
                orders: []
            };

            // Search Products
            Object.values(products).forEach(p => {
                if ((p.title && p.title.toLowerCase().includes(lowerQuery)) || (p.description && p.description.toLowerCase().includes(lowerQuery))) {
                    results.products.push(p);
                }
            });

            // Search Customers
            Object.values(customers).forEach(c => {
                if ((c.name && c.name.toLowerCase().includes(lowerQuery)) || (c.mobile && c.mobile.includes(lowerQuery))) {
                    results.customers.push(c);
                }
            });

            // Search Orders (Transactions)
            transactions.forEach(t => {
                const productTitle = products[t.productId]?.title || '';
                const buyerName = customers[t.buyerMobile]?.name || '';
                const sellerName = customers[t.sellerMobile]?.name || '';
                if (productTitle.toLowerCase().includes(lowerQuery) || buyerName.toLowerCase().includes(lowerQuery) || sellerName.toLowerCase().includes(lowerQuery)) {
                    results.orders.push(t);
                }
            });

            return results;
        }

        function renderGlobalAdminSearchResults(results, query) {
            const container = document.getElementById('global-search-results');
            let html = '';

            if (results.products.length === 0 && results.customers.length === 0 && results.orders.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 p-4">No results found.</p>';
                return;
            }

            if (results.products.length > 0) {
                html += `<h3 class="text-lg font-semibold mb-2 px-2">Products</h3>`;
                html += results.products.slice(0, 5).map(p => `
                    <div class="p-3 border-b hover:bg-slate-100 cursor-pointer" onclick="openProductEditModal('${p.id}')">
                        <p class="font-medium">${highlightText(p.title, query)}</p>
                        <p class="text-sm text-gray-600">Seller: ${p.sellerName}</p>
                    </div>
                `).join('');
            }

            if (results.customers.length > 0) {
                html += `<h3 class="text-lg font-semibold mt-4 mb-2 px-2">Customers</h3>`;
                html += results.customers.slice(0, 5).map(c => `
                    <div class="p-3 border-b hover:bg-slate-100 cursor-pointer" onclick="openCustomerDetailModal('${c.mobile}')">
                        <p class="font-medium">${highlightText(c.name, query)} (${highlightText(c.mobile, query)})</p>
                    </div>
                `).join('');
            }

            if (results.orders.length > 0) {
                html += `<h3 class="text-lg font-semibold mt-4 mb-2 px-2">Orders</h3>`;
                html += results.orders.slice(0, 5).map(t => `
                    <div class="p-3 border-b hover:bg-slate-100 cursor-pointer" onclick="openEditStatusModalWrapper('${t.id}')">
                        <p class="font-medium">Order for ${highlightText(products[t.productId]?.title || 'N/A', query)}</p>
                        <p class="text-sm text-gray-600">Buyer: ${highlightText(customers[t.buyerMobile]?.name || 'N/A', query)}</p>
                    </div>
                `).join('');
            }
            
            container.innerHTML = `<div class="bg-white rounded-lg shadow">${html}</div>`;
        }

        function openEditStatusModalWrapper(transactionId) {
            const transaction = transactions.find(t => t.id === transactionId);
            if (transaction) {
                openEditStatusModal(transaction);
            }
        }

        // --- RENDER FUNCTIONS ---
        function renderDashboard() {
            const approvedCount = Object.values(products).filter(p => p.status === 'approved').length;
            const pendingCount = Object.values(products).filter(p => p.status === 'pending_approval').length;
            const openDisputes = transactions.filter(t => t.status === 'dispute_raised').length;

            const revenueTransactions = transactions.filter(t => t.status !== 'dispute_raised' && t.type !== 'deposit_return');
            const totalRevenue = revenueTransactions.reduce((sum, t) => {
                // For rentals, revenue is only the rental fee, not the security deposit
                if (t.type === 'rent') return sum + (parseFloat(t.rentalTotal) || 0) - (parseFloat(t.discountApplied) || 0);
                return sum + (parseFloat(t.amountPaid) || 0);
            }, 0);
            const totalCommission = revenueTransactions.reduce((sum, t) => sum + (parseFloat(t.commission) || 0), 0);
            const depositsHeld = transactions.reduce((sum, t) => {
                if(t.type === 'rent' && t.depositStatus !== 'returned') return sum + (parseFloat(t.securityDeposit) || 0);
                return sum;
            }, 0);


            appContent.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                    <div class="bg-white p-6 rounded-lg shadow"><h3 class="text-gray-500">Active Listings</h3><p class="text-3xl font-bold mt-2">${approvedCount}</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><h3 class="text-gray-500">Pending Approval</h3><p class="text-3xl font-bold mt-2 text-yellow-600">${pendingCount}</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><h3 class="text-gray-500">Total Revenue</h3><p class="text-3xl font-bold mt-2">₹${totalRevenue.toFixed(2)}</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><h3 class="text-gray-500">Commission Earned</h3><p class="text-3xl font-bold mt-2 text-green-600">₹${totalCommission.toFixed(2)}</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><h3 class="text-gray-500">Security Deposits Held</h3><p class="text-3xl font-bold mt-2 text-blue-600">₹${depositsHeld.toFixed(2)}</p></div>
                    <div class="bg-white p-6 rounded-lg shadow"><h3 class="text-gray-500">Open Disputes</h3><p class="text-3xl font-bold mt-2 text-red-600">${openDisputes}</p></div>
                </div>
            `;
        }

        function renderListings(filterStatus = 'all') {
            const subNavButtons = [
                { status: 'all', label: 'All' },
                { status: 'pending_approval', label: 'Pending' },
                { status: 'approved', label: 'Approved' },
                { status: 'rejected', label: 'Rejected' },
                { status: 'sold', label: 'Sold' }
            ];

            appContent.innerHTML = `
                <div>
                    <h2 class="text-2xl font-bold mb-4">Manage Listings</h2>
                    <div class="border-b border-gray-200 mb-4">
                        <nav class="-mb-px flex space-x-4 overflow-x-auto" aria-label="Tabs">
                            ${subNavButtons.map(btn => `
                                <button data-filter="${btn.status}" class="sub-nav-button whitespace-nowrap py-3 px-4 border-b-2 font-medium text-sm ${filterStatus === btn.status ? 'active' : ''}">
                                    ${btn.label}
                                </button>
                            `).join('')}
                        </nav>
                    </div>
                    <div class="table-container bg-white rounded-lg shadow overflow-x-auto">
                        <table class="w-full min-w-max">
                            <thead>
                                <tr class="border-b-2">
                                    <th class="p-3 text-left text-sm font-semibold">Image</th>
                                    <th class="p-3 text-left text-sm font-semibold">Product</th>
                                    <th class="p-3 text-left text-sm font-semibold">Seller</th>
                                    <th class="p-3 text-left text-sm font-semibold">Details</th>
                                    <th class="p-3 text-left text-sm font-semibold">Status</th>
                                    <th class="p-3 text-left text-sm font-semibold">Actions</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            `;

            document.querySelectorAll('.sub-nav-button').forEach(btn => {
                btn.addEventListener('click', () => renderListings(btn.dataset.filter));
            });

            const productList = Object.values(products).filter(p => filterStatus === 'all' || p.status === filterStatus);
            productList.sort((a, b) => new Date(b.listedDate) - new Date(a.listedDate));

            const tableBody = appContent.querySelector('tbody');
            if (productList.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-center p-8 text-gray-500">No listings found for this filter.</td></tr>`;
                return;
            }

            tableBody.innerHTML = productList.map(p => {
                const imageUrl = getGoogleDriveImageUrl(p.imageUrl);
                const statusText = (p.status || '').replace(/_/g, ' ');
                let statusClass = 'bg-gray-100 text-gray-800';
                if (p.status === 'sold') statusClass = 'bg-red-100 text-red-800';
                else if (p.status === 'approved') statusClass = 'bg-green-100 text-green-800';
                else if (p.status === 'pending_approval') statusClass = 'bg-yellow-100 text-yellow-800';
                else if (p.status === 'rejected') statusClass = 'bg-slate-200 text-slate-600';

                let actionButtons = '';
                if (p.status === 'pending_approval') {
                    actionButtons += `<button onclick="handleAction('Approve', '${p.id}')" class="text-xs font-semibold text-green-600 hover:underline">Approve</button>`;
                    actionButtons += `<button onclick="handleAction('Reject', '${p.id}')" class="text-xs font-semibold text-red-600 hover:underline">Reject</button>`;
                }
                actionButtons += `<button onclick="openItemEditModal('${p.id}')" class="text-xs font-semibold text-blue-600 hover:underline">Edit</button>`;
                actionButtons += `<button onclick="handleAction('Delete', '${p.id}')" class="text-xs font-semibold text-red-600 hover:underline">Delete</button>`;

        function renderPayments() {
            let ledgerItems = [];

            transactions.forEach(t => {
                const product = products[t.productId] || { title: 'Unknown' };
                const buyer = customers[t.buyerMobile] || { name: t.buyerMobile };
                const seller = customers[t.sellerMobile] || { name: t.sellerMobile };
                const txDate = new Date(t.timestamp);
                const commission = parseFloat(t.commission) || 0;

                if (commission > 0) {
                    ledgerItems.push({ date: txDate, description: `Commission from ${t.type} of '${product.title}' (Sold by ${seller.name})`, debit: 0, credit: commission, transactionId: t.id });
                }
                
                if (t.status === 'payout_complete') {
                    const payoutAmount = (t.type === 'sale' ? (parseFloat(t.amountPaid) || 0) : (parseFloat(t.rentalTotal) || 0)) - commission;
                    if (payoutAmount > 0) {
                        ledgerItems.push({ date: t.payoutDate ? new Date(t.payoutDate) : txDate, description: `Payout to ${seller.name} for '${product.title}'`, debit: payoutAmount, credit: 0, transactionId: t.id });
                    }
                }
                
                if (t.type === 'rent') {
                    const deposit = parseFloat(t.securityDeposit) || 0;
                    if (deposit > 0) {
                        ledgerItems.push({ date: txDate, description: `Security deposit held from ${buyer.name} for '${product.title}'`, debit: 0, credit: deposit, isDeposit: true, transactionId: t.id });
                        if (t.depositStatus === 'returned') {
                            ledgerItems.push({ date: t.depositReturnDate ? new Date(t.depositReturnDate) : txDate, description: `Security deposit returned to ${buyer.name} for '${product.title}'`, debit: deposit, credit: 0, isDeposit: true, transactionId: t.id });
                        }
                    }
                }
            });

            // Sorting logic
            ledgerItems.sort((a, b) => {
                let valA = a[ledgerSortState.column];
                let valB = b[ledgerSortState.column];
                const direction = ledgerSortState.direction === 'asc' ? 1 : -1;

                if (ledgerSortState.column === 'description') {
                    return valA.localeCompare(valB) * direction;
                }
                return (valA < valB ? -1 : 1) * direction;
            });

            const totalDebit = ledgerItems.reduce((sum, item) => sum + item.debit, 0);
            const totalCredit = ledgerItems.reduce((sum, item) => sum + item.credit, 0);
            const netProfit = ledgerItems.filter(i => !i.isDeposit).reduce((sum, item) => sum + item.credit - item.debit, 0);
            
            const rows = ledgerItems.map(item => `
                <tr class="border-b ${item.isDeposit ? 'bg-slate-50 text-slate-600' : 'hover:bg-slate-50'}">
                    <td class="p-3 whitespace-nowrap">${item.date.toLocaleDateString()}</td>
                    <td class="p-3">${item.description}</td>
                    <td class="p-3 text-right font-mono text-red-600">${item.debit > 0 ? `₹${item.debit.toFixed(2)}` : ''}</td>
                    <td class="p-3 text-right font-mono text-green-600">${item.credit > 0 ? `₹${item.credit.toFixed(2)}` : ''}</td>
                </tr>
            `).join('');

            appContent.innerHTML = `
                <div class="print-area">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-2xl font-bold">Marketplace Ledger</h2>
                        <button onclick="window.print()" class="bg-slate-200 px-3 py-1 rounded-md no-print">Print</button>
                    </div>
                     <div class="table-container bg-white rounded-lg shadow overflow-x-auto">
                        <table class="w-full min-w-max">
                            <thead>
                                <tr class="border-b-2">
                                    <th class="p-3 text-left text-sm font-semibold sortable-header" onclick="setLedgerSort('date')">Date</th>
                                    <th class="p-3 text-left text-sm font-semibold sortable-header" onclick="setLedgerSort('description')">Particulars</th>
                                    <th class="p-3 text-right text-sm font-semibold sortable-header" onclick="setLedgerSort('debit')">Debit (Out)</th>
                                    <th class="p-3 text-right text-sm font-semibold sortable-header" onclick="setLedgerSort('credit')">Credit (In)</th>
                                </tr>
                            </thead>
                            <tbody>${rows}</tbody>
                            <tfoot class="font-bold bg-slate-100">
                                <tr>
                                    <td colspan="2" class="p-3 text-right">Totals</td>
                                    <td class="p-3 text-right font-mono text-red-700">₹${totalDebit.toFixed(2)}</td>
                                    <td class="p-3 text-right font-mono text-green-700">₹${totalCredit.toFixed(2)}</td>
                                </tr>
                                <tr>
                                    <td colspan="3" class="p-3 text-right">Net Cash Flow</td>
                                    <td class="p-3 text-right font-mono text-lg">${(totalCredit - totalDebit) >= 0 ? `₹${(totalCredit - totalDebit).toFixed(2)}` : `-₹${Math.abs(totalCredit - totalDebit).toFixed(2)}`}</td>
                                </tr>
                                 <tr>
                                    <td colspan="3" class="p-3 text-right">Net Profit (Commission - Payouts)</td>
                                    <td class="p-3 text-right font-mono text-lg text-blue-700">${netProfit >= 0 ? `₹${netProfit.toFixed(2)}` : `-₹${Math.abs(netProfit).toFixed(2)}`}</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </div>
            `;
            updateLedgerSortIndicators();
        }

        // --- ACTION HANDLER ---
        async function handleAction(action, id) {
            action = action.toLowerCase();
            if (action.includes('approve')) {
                await db.ref(`marketplaceProducts/${id}`).update({ status: 'approved' });
                showToast('Listing approved.');
            } else if (action.includes('reject')) {
                await db.ref(`marketplaceProducts/${id}`).update({ status: 'rejected' });
                showToast('Listing rejected.');
            } else if (action.includes('delete')) {
                 if (confirm("Are you sure you want to delete this item? This cannot be undone.")) {
                    const product = products[id];
                    const transaction = transactions.find(t => t.id === id);
                    if (product) await db.ref(`marketplaceProducts/${id}`).remove();
                    if (transaction) await db.ref(`transactions/${id}`).remove();
                    showToast('Item deleted.');
                }
            } else if (action.includes('edit_status')) {
                const transaction = transactions.find(t => t.id === id);
                if(transaction) openEditStatusModal(transaction);
            } else if (action.includes('resolve_dispute')) {
                const transaction = transactions.find(t => t.id === id);
                if(transaction) openResolveDisputeModal(transaction);
            } else if (action.includes('mark_paid')) {
                 if (confirm("Mark this transaction as paid out to the seller?")) {
                    await db.ref(`transactions/${id}`).update({ status: 'payout_complete' });
                    showToast('Transaction marked as paid.');
                }
            } else if (action.includes('mark_returned')) {
                 if (confirm("Mark this rental as returned?")) {
                    await db.ref(`transactions/${id}`).update({ status: 'returned' });
                    showToast('Rental marked as returned.');
                }
            } else if (action.includes('return_deposit')) {
                 const transaction = transactions.find(t => t.id === id);
                 if (transaction && confirm(`Return security deposit of ₹${(transaction.securityDeposit || 0).toFixed(2)} for this rental?`)) {
                    await db.ref(`transactions/${id}`).update({ depositStatus: 'returned' });
                    showToast('Deposit marked as returned.');
                }
            }
        }
        window.handleAction = handleAction;

            const statuses = ['pending', 'confirmed', 'shipped', 'delivered', 'cancelled', 'dispute_raised', 'payout_complete', 'rented_out', 'returned'];

                    <button onclick="document.getElementById('edit-modal').style.display='none'" class="bg-gray-200 py-2 px-4 rounded font-semibold">Cancel</button>
                    <button onclick="updateTransactionStatus('${transaction.id}')" class="bg-indigo-600 text-white py-2 px-4 rounded font-semibold">Save</button>
                </div>
            `;
            modal.style.display = 'flex';
        }
        
        async function updateTransactionStatus(id) {
            const newStatus = document.getElementById('status-select').value;
            await db.ref(`transactions/${id}`).update({ status: newStatus });
            showToast('Status updated.');
            document.getElementById('edit-modal').style.display = 'none';
        }
        window.updateTransactionStatus = updateTransactionStatus;

        function openItemEditModal(productId) {
            const product = products[productId];
            const modal = document.getElementById('item-detail-modal');
            const content = document.getElementById('item-detail-content');
            
            content.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <h3 class="text-xl font-bold">Edit: ${product.title}</h3>
                    <button onclick="document.getElementById('item-detail-modal').style.display='none'" class="text-gray-500 text-2xl">&times;</button>
                </div>
                <div class="space-y-4">
                     <div>
                        <label class="block text-sm font-medium">Sale Commission (%)</label>
                        <input type="number" id="edit-sale-commission" class="form-input mt-1" value="${product.saleCommissionPercentage || ''}" placeholder="Default (${marketplaceSettings.defaultSaleCommission || 10}%)">
                    </div>
                     <div>
                        <label class="block text-sm font-medium">Rent Commission (%)</label>
                        <input type="number" id="edit-rent-commission" class="form-input mt-1" value="${product.rentCommissionPercentage || ''}" placeholder="Default (${marketplaceSettings.defaultRentCommission || 15}%)">
                    </div>
                </div>
                <div class="text-right mt-6">
                    <button onclick="saveItemChanges('${product.id}')" class="bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg">Save Changes</button>
                </div>
            `;
            modal.style.display = 'flex';
        }

        async function saveItemChanges(productId) {
            const saleComm = document.getElementById('edit-sale-commission').value;
            const rentComm = document.getElementById('edit-rent-commission').value;

            const updates = {
                saleCommissionPercentage: saleComm ? parseFloat(saleComm) : null,
                rentCommissionPercentage: rentComm ? parseFloat(rentComm) : null
            };

            try {
                await db.ref(`marketplaceProducts/${productId}`).update(updates);
                showToast("Product commissions updated!");
                document.getElementById('item-detail-modal').style.display = 'none';
            } catch (error) {
                showToast("Error saving changes.", 4000);
                console.error(error);
            }
        }
        window.saveItemChanges = saveItemChanges;

        // --- NOTIFICATIONS & CHAT ---
        function updateAdminNotificationBadge() {
            const badge = document.getElementById('notification-badge');
            badge.textContent = unreadAdminNotifications;
            badge.classList.toggle('hidden', unreadAdminNotifications === 0);
        }

        function renderAdminNotifications() {
            const dropdown = document.getElementById('notification-dropdown');
            if (adminNotifications.length === 0) {
                dropdown.innerHTML = `<p class="p-4 text-center text-sm text-gray-500">No new notifications.</p>`;
                return;
            }
            dropdown.innerHTML = adminNotifications.map(n => `
                <div class="p-3 border-b text-sm cursor-pointer hover:bg-slate-50">
                    <p class="font-semibold">${n.text}</p>
                    <p class="text-xs text-slate-500">From: ${n.fromName || n.from}</p>
                </div>
            `).join('');
        }
        
        function updateAdminChatBadge() {
            const badge = document.getElementById('chat-badge');
            badge.textContent = unreadChats.size;
            badge.classList.toggle('hidden', unreadChats.size === 0);
        }

        async function sendMessageToUser(chatId, text, recipientMobile) {
            if (!db) {
                showToast("Database not connected.");
                return;
            }
            const messagesRef = db.ref(`chats/${chatId}/messages`);
            try {
                await messagesRef.push({
                    text: text,
                    sender: ADMIN_MOBILE,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });

                // Also send a notification to the client
                const clientNotifRef = db.ref(`clientNotifications/${recipientMobile}`).push();
                await clientNotifRef.set({
                    title: 'New Message from Admin',
                    body: text,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                console.log(`Message sent and notification pushed to ${recipientMobile}`);
            } catch (error) {
                console.error("Error sending message:", error);
                showToast("Failed to send message.");
            }
        }

        function openChatModal(userMobile) {
            const modal = document.getElementById('chat-modal');
            const content = document.getElementById('chat-modal-content');
            const chatId = [userMobile, ADMIN_MOBILE].sort().join('_');
            const chatMessages = chats[chatId] ? Object.values(chats[chatId].messages).sort((a,b) => a.timestamp - b.timestamp) : [];

            content.innerHTML = `
                <div class="p-4 border-b flex justify-between items-center">
                    <h3 class="text-xl font-bold">Chat with ${customers[userMobile]?.name || userMobile}</h3>
                    <button onclick="document.getElementById('chat-modal').style.display='none'" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
                </div>
                <div id="chat-history-messages" class="flex-grow overflow-y-auto bg-gray-100 p-4 space-y-2 flex flex-col">
                    ${chatMessages.map(msg => `
                        <div class="chat-bubble p-2 rounded-lg ${msg.sender === ADMIN_MOBILE ? 'sent' : 'received'}">
                            <p>${msg.text}</p>
                        </div>
                    `).join('')}
                </div>
                <form id="admin-chat-form" class="p-4 border-t flex gap-2">
                    <input type="text" id="admin-chat-input" class="w-full border rounded-full px-4 py-2" placeholder="Type a message..." required autocomplete="off">
                    <button type="submit" class="bg-indigo-600 text-white rounded-full p-2 w-10 h-10 flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" /></svg>
                    </button>
                </form>
            `;
            modal.style.display = 'flex';
            const chatHistory = document.getElementById('chat-history-messages');
            chatHistory.scrollTop = chatHistory.scrollHeight;
            
            // Mark as read
            unreadChats.delete(chatId);
            updateAdminChatBadge();

            document.getElementById('admin-chat-form').addEventListener('submit', e => {
                e.preventDefault();
                const input = document.getElementById('admin-chat-input');
                const text = input.value.trim();
                if (text) {
                    sendMessageToUser(chatId, text, userMobile);
                    input.value = '';
                }
            });
        }
        window.openChatModal = openChatModal;


        function openChatList() {
             const modal = document.getElementById('chat-modal');
             const content = document.getElementById('chat-modal-content');
             const chatEntries = Object.entries(chats);

             content.innerHTML = `
                <div class="p-4 border-b flex justify-between items-center">
                    <h3 class="text-xl font-bold">Conversations</h3>
                    <button onclick="document.getElementById('chat-modal').style.display='none'" class="text-gray-500 hover:text-gray-800 text-2xl">&times;</button>
                </div>
                <div class="overflow-y-auto">
                    ${chatEntries.length > 0 ? chatEntries.map(([chatId, chatData]) => {
                        const userMobile = chatId.replace(ADMIN_MOBILE, '').replace('_', '');
                        const lastMsg = Object.values(chatData.messages || {}).sort((a,b) => b.timestamp - a.timestamp)[0];
                        return `
                        <div onclick="openChatModal('${userMobile}')" class="p-4 border-b hover:bg-slate-50 cursor-pointer ${unreadChats.has(chatId) ? 'font-bold' : ''}">
                            <p>${customers[userMobile]?.name || userMobile}</p>
                            <p class="text-sm text-slate-500 truncate">${lastMsg ? lastMsg.text : 'No messages yet'}</p>
                        </div>
                        `
                    }).join('') : '<p class="p-8 text-center text-slate-500">No conversations yet.</p>'}
                </div>
             `;
             modal.style.display = 'flex';
        }

        // --- Settings Page Logic ---
        async function saveCommissionSettings(e) {
            e.preventDefault();
            const saleComm = document.getElementById('default-sale-commission').value;
            const rentComm = document.getElementById('default-rent-commission').value;
            try {
                await db.ref('marketplaceSettings').update({
                    defaultSaleCommission: parseFloat(saleComm),
                    defaultRentCommission: parseFloat(rentComm)
                });
                showToast("Default commissions saved!");
            } catch (error) {
                showToast("Error saving settings.", 4000);
            }
        }

        async function savePromoCode(e) {
            e.preventDefault();
            const id = document.getElementById('promo-id').value || Date.now();
            const code = document.getElementById('promo-code').value.toUpperCase().trim();
            if (!code) {
                showToast("Promo code cannot be empty.");
                return;
            }
            const promo = {
                id: id.toString(),
                code: code,
                discountType: document.getElementById('promo-type').value,
                discountValue: parseFloat(document.getElementById('promo-value').value) || 0,
                minOrderValue: parseFloat(document.getElementById('promo-min-order').value) || null,
                isActive: true
            };
            try {
                await db.ref('marketplaceSettings/promoCodes/' + promo.id).set(promo);
                showToast("Promo code saved!");
                e.target.reset();
            } catch (error) {
                showToast("Error saving promo code.", 4000);
            }
        }
        
        async function savePromotionSettings(e) {
            e.preventDefault();
            const message = document.getElementById('promotion-message').value.trim();
            const isActive = document.getElementById('promotion-active').checked;
            
            if (isActive && !message) {
                showToast("Please enter a message before activating the promotion.", 4000);
                return;
            }

            try {
                await db.ref('marketplaceSettings/promotion').set({ message, isActive });
                showToast('Promotion settings saved!');
            } catch(err) {
                console.error(err);
                showToast('Error saving promotion settings.', 4000);
            }
        }

        async function togglePromoStatus(id) {
            const promo = marketplaceSettings.promoCodes[id];
            if (promo) {
                await db.ref(`marketplaceSettings/promoCodes/${id}/isActive`).set(!promo.isActive);
                showToast(`Promo code ${!promo.isActive ? 'activated' : 'deactivated'}.`);
            }
        }
        window.togglePromoStatus = togglePromoStatus;

        async function deletePromo(id) {
            if (confirm("Are you sure you want to delete this promo code?")) {
                await db.ref(`marketplaceSettings/promoCodes/${id}`).remove();
                showToast("Promo code deleted.");
            }
        }
        window.deletePromo = deletePromo;

        // --- Ledger Sorting ---
        function setLedgerSort(column) {
            if (ledgerSortState.column === column) {
                ledgerSortState.direction = ledgerSortState.direction === 'asc' ? 'desc' : 'asc';
            } else {
                ledgerSortState.column = column;
                ledgerSortState.direction = (column === 'date') ? 'desc' : 'asc';
            }
            renderPayments();
        }
        window.setLedgerSort = setLedgerSort;

        function updateLedgerSortIndicators() {
            appContent.querySelectorAll('.sortable-header').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.getAttribute('onclick').includes(`'${ledgerSortState.column}'`)) {
                    th.classList.add(ledgerSortState.direction === 'asc' ? 'sort-asc' : 'sort-desc');
                }
            });
        }

        // --- INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            try {
                if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
                db = firebase.database();
            } catch(e) { console.error(e); alert("Firebase connection failed."); }

            tabs.forEach(tab => tab.addEventListener('click', () => switchView(tab.id.replace('tab-', ''))));
            
            // --- GLOBAL SEARCH LISTENER ---
            const globalSearchInput = document.getElementById('global-admin-search');
            const globalSearchResultsContainer = document.getElementById('global-search-results');

            globalSearchInput.addEventListener('input', debounce((e) => {
                const query = e.target.value.trim();
                if (!query) {
                    globalSearchResultsContainer.innerHTML = '';
                    appContent.style.display = 'block'; // Show main content
                    return;
                }
                const results = globalAdminSearch(query);
                renderGlobalAdminSearchResults(results, query);
                appContent.style.display = 'none'; // Hide main content
            }, 300));

            const dataRefs = {
                marketplaceProducts: (snap) => { products = snap.val() || {}; },
                transactions: (snap) => { transactions = Object.values(snap.val() || {}); },
                customers: (snap) => {
                    const customerList = Object.values(snap.val() || {});
                    customers = customerList.reduce((obj, c) => { if(c.mobile) obj[c.mobile] = c; return obj; }, {});
                },
                adminNotifications: (snap) => {
                    adminNotifications = Object.values(snap.val() || {}).sort((a,b) => b.timestamp - a.timestamp);
                    unreadAdminNotifications = adminNotifications.length; // Simple count for now
                    updateAdminNotificationBadge();
                    renderAdminNotifications();
                },
                chats: (snap) => {
                    chats = snap.val() || {};
                    unreadChats.clear();
                    Object.entries(chats).forEach(([chatId, chatData]) => {
                        const lastMsg = Object.values(chatData.messages || {}).sort((a,b) => b.timestamp - a.timestamp)[0];
                        if (lastMsg && lastMsg.sender !== ADMIN_MOBILE) {
                            // In a real app, you'd check a "lastRead" timestamp
                            unreadChats.add(chatId);
                        }
                    });
                    updateAdminChatBadge();
                },
                marketplaceSettings: (snap) => {
                    marketplaceSettings = snap.val() || { defaultSaleCommission: 10, defaultRentCommission: 15, promoCodes: {} };
                }
            };
            
            Object.entries(dataRefs).forEach(([refName, callback]) => {
                db.ref(refName).on('value', snap => {
                    callback(snap);
                    const activeView = document.querySelector('.nav-button.active')?.id.replace('tab-','');
                    if (activeView && renderFunctions[activeView] && !globalSearchInput.value.trim()) {
                        renderFunctions[activeView]();
                    }
                });
            });

            document.getElementById('notification-icon-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('notification-dropdown').classList.toggle('hidden');
                unreadAdminNotifications = 0; // Mark as read on open
                updateAdminNotificationBadge();
            });

            document.getElementById('chat-icon-btn').addEventListener('click', openChatList);

            document.addEventListener('click', (e) => {
                if (!e.target.closest('#admin-notification-bell-container')) {
                     document.getElementById('notification-dropdown').classList.add('hidden');
                }
            });

            window.openItemEditModal = (id) => { openProductEditModal(id); };
            window.openProductEditModal = openProductEditModal;
            window.saveProductChangesFromModal = saveProductChangesFromModal;
            window.openEditStatusModalWrapper = openEditStatusModalWrapper;
            window.openCustomerDetailModal = openCustomerDetailModal;

            switchView('dashboard');
        });

        // --- NEW MODAL FUNCTIONS FOR SEARCH RESULTS ---
        function openProductEditModal(productId) {
            const product = products[productId];
            if (!product) {
                showToast("Product not found");
                return;
            }
            const modal = document.getElementById('edit-modal');
            const content = document.getElementById('edit-modal-content');
            const statuses = ['pending_approval', 'approved', 'rejected', 'sold'];

            content.innerHTML = `
                <h3 class="font-bold text-lg mb-4">Edit Product: ${product.title}</h3>
                <div class="space-y-4">
                    <div>
                        <label for="product-status-select" class="block text-sm font-medium text-gray-700">Status</label>
                        <select id="product-status-select" class="form-select mt-1 w-full">
                            ${statuses.map(s => `<option value="${s}" ${s === product.status ? 'selected' : ''}>${s.replace(/_/g, ' ')}</option>`).join('')}
                        </select>
                    </div>
                     <div>
                        <label for="product-image-url" class="block text-sm font-medium text-gray-700">Image URL (Google Drive)</label>
                        <input type="text" id="product-image-url" class="form-input mt-1 w-full" value="${product.imageUrl || ''}">
                    </div>
                </div>
                <div class="flex justify-end gap-2 mt-6">
                    <button onclick="document.getElementById('edit-modal').style.display='none'" class="bg-gray-200 py-2 px-4 rounded font-semibold">Cancel</button>
                    <button onclick="saveProductChangesFromModal('${product.id}')" class="bg-indigo-600 text-white py-2 px-4 rounded font-semibold">Save</button>
                </div>
            `;
            modal.style.display = 'flex';
        }

        async function saveProductChangesFromModal(productId) {
            const newStatus = document.getElementById('product-status-select').value;
            const newImageUrl = document.getElementById('product-image-url').value;
            const updates = { status: newStatus, imageUrl: newImageUrl };
            try {
                await db.ref(`marketplaceProducts/${productId}`).update(updates);
                showToast('Product updated.');
                document.getElementById('edit-modal').style.display = 'none';
            } catch (e) {
                showToast('Error updating product.');
                console.error(e);
            }
        }
        
        function openCustomerDetailModal(customerMobile) {
            const customer = customers[customerMobile];
            if (!customer) return;

            const modal = document.getElementById('edit-modal');
            const content = document.getElementById('edit-modal-content');

            const customerOrders = transactions.filter(t => t.buyerMobile === customerMobile || t.sellerMobile === customerMobile)
                .sort((a,b) => b.timestamp - a.timestamp);

            content.innerHTML = `
                <h3 class="font-bold text-lg mb-4">Customer: ${customer.name}</h3>
                <p class="text-sm text-gray-600">${customer.mobile}</p>
                <h4 class="font-semibold mt-4 mb-2">Recent Transactions</h4>
                <div class="max-h-60 overflow-y-auto border rounded-md">
                    ${customerOrders.length > 0 ? customerOrders.map(t => `
                        <div class="p-2 border-b">
                            <p class="text-sm">${new Date(t.timestamp).toLocaleDateString()}: ${t.type} of ${products[t.productId]?.title || 'item'}</p>
                            <p class="text-xs text-gray-500">Amount: ₹${(t.amountPaid || 0).toFixed(2)}</p>
                        </div>
                    `).join('') : '<p class="p-2 text-sm text-gray-500">No transactions found.</p>'}
                </div>
                <div class="flex justify-end mt-4">
                     <button onclick="document.getElementById('edit-modal').style.display='none'" class="bg-gray-200 py-2 px-4 rounded font-semibold">Close</button>
                </div>
            `;
            modal.style.display = 'flex';
        }

    </script>
